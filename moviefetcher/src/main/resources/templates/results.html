<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'Risultati: ' + ${query}">Risultati</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0a;
            --surface: #111111;
            --border: #222222;
            --accent: #e8c547;
            --text: #f0ede6;
            --muted: #666;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            padding: 2rem;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 99;
            opacity: 0.4;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 900px;
            margin: 0 auto 3rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 0.05em;
            text-decoration: none;
            color: var(--text);
        }

        .logo span { color: var(--accent); }

        .search-row {
            display: flex;
            border: 1px solid var(--border);
            transition: border-color 0.2s;
        }

        .search-row:focus-within { border-color: var(--accent); }

        .search-row input {
            background: var(--surface);
            border: none;
            outline: none;
            padding: 0.6rem 1rem;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            width: 260px;
        }

        .search-row input::placeholder { color: var(--muted); font-style: italic; }

        .search-row button {
            background: var(--accent);
            border: none;
            padding: 0.6rem 1rem;
            cursor: pointer;
            color: #0a0a0a;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 0.9rem;
            letter-spacing: 0.1em;
        }

        .results-header {
            max-width: 900px;
            margin: 0 auto 1.5rem;
        }

        .results-header h1 {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2.5rem;
            letter-spacing: 0.05em;
        }

        .results-header h1 span { color: var(--accent); }

        .count {
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 0.3rem;
        }

        .results-grid {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1px;
            background: var(--border);
        }

        .movie-row {
            display: flex;
            align-items: center;
            background: var(--bg);
            padding: 1rem 1.2rem;
            text-decoration: none;
            color: var(--text);
            transition: background 0.15s;
            gap: 1.5rem;
            animation: fadeIn 0.4s ease both;
        }

        .movie-row:hover { background: var(--surface); }

        .movie-id {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.1rem;
            color: var(--accent);
            min-width: 60px;
            letter-spacing: 0.05em;
        }

        .movie-title {
            flex: 1;
            font-size: 1rem;
            font-weight: 400;
        }

        .movie-date {
            font-size: 0.8rem;
            color: var(--muted);
            letter-spacing: 0.1em;
            white-space: nowrap;
        }

        .arrow {
            color: var(--muted);
            font-size: 0.8rem;
            transition: color 0.15s, transform 0.15s;
        }

        .movie-row:hover .arrow {
            color: var(--accent);
            transform: translateX(4px);
        }

        .empty {
            max-width: 900px;
            margin: 4rem auto;
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .movie-row:nth-child(1)  { animation-delay: 0.03s; }
        .movie-row:nth-child(2)  { animation-delay: 0.06s; }
        .movie-row:nth-child(3)  { animation-delay: 0.09s; }
        .movie-row:nth-child(4)  { animation-delay: 0.12s; }
        .movie-row:nth-child(5)  { animation-delay: 0.15s; }
        .movie-row:nth-child(n+6){ animation-delay: 0.18s; }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="/" class="logo">Movie<span>Fetcher</span></a>
        <form th:action="@{/search}" method="get">
            <div class="search-row">
                <input type="text" name="title" th:value="${query}" placeholder="Nuova ricerca...">
                <button type="submit">Go</button>
            </div>
        </form>
    </div>

    <div class="results-header">
        <h1>Results <span th:text="${query}"></span></h1>
        <p class="count" th:text="${movies.size()} + ' film trovati'"></p>
    </div>

    <div class="results-grid" th:if="${not #lists.isEmpty(movies)}">
        <a th:each="movie : ${movies}"
           th:href="@{/movie/{id}(id=${movie.id})}"
           class="movie-row">
            <span class="movie-id" th:text="${movie.id}"></span>
            <span class="movie-title" th:text="${movie.title}"></span>
            <span class="movie-date" th:text="${movie.release_date}"></span>
            <span class="arrow">→</span>
        </a>
    </div>

    <div class="empty" th:if="${#lists.isEmpty(movies)}">
        No results
    </div>
</body>
</html>
