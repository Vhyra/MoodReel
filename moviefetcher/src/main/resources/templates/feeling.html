<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MovieFetcher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0a;
            --surface: #111111;
            --border: #222222;
            --accent: #e8c547;
            --text: #f0ede6;
            --muted: #666;
            --red: #c94040;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow-x: hidden;
        }

        /* Grain overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 99;
            opacity: 0.4;
        }

        .inspire-btn {
            display: inline-block;
            background: var(--accent);
            color: #0a0a0a;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.1em;
            padding: 0.9rem 1.4rem;
            text-decoration: none;
            transition: background 0.2s;
            cursor: pointer;
        }

        .inspire-btn:hover {
            background: #f0d060;
        }

        .hero {
            text-align: center;
            margin-bottom: 4rem;
            animation: fadeUp 0.8s ease both;
        }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: clamp(4rem, 12vw, 9rem);
            letter-spacing: 0.05em;
            line-height: 1;
            color: var(--text);
            position: relative;
        }

        .logo span {
            color: var(--accent);
        }

        .tagline {
            font-size: 0.85rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--muted);
            margin-top: 0.5rem;
            font-weight: 300;
        }

        .search-container {
            width: 100%;
            max-width: 640px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .search-block {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            animation: fadeUp 0.8s ease both;
        }

        .search-block:nth-child(2) { animation-delay: 0.1s; }

        .search-row textarea {
            flex: 1;
            background: var(--surface);
            border: none;
            outline: none;
            padding: 0.9rem 1.2rem;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            resize: none;
            overflow-y: auto;
            overflow-x: hidden;
            height: calc(1.5em * 5 + 1.8rem); /* 5 righe visibili */
            line-height: 1.5;
        }

        .search-row textarea::placeholder {
            color: var(--muted);
            font-style: italic;
        }

        .search-label {
            font-size: 0.7rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .search-row {
            display: flex;
            gap: 0;
            border: 1px solid var(--border);
            transition: border-color 0.2s;
        }

        .search-row:focus-within {
            border-color: var(--accent);
        }

        .search-row input {
            flex: 1;
            background: var(--surface);
            border: none;
            outline: none;
            padding: 0.9rem 1.2rem;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 1rem;
            font-weight: 300;
        }

        .search-row input::placeholder {
            color: var(--muted);
            font-style: italic;
        }

        .search-row button {
            background: var(--accent);
            border: none;
            padding: 0.9rem 1.4rem;
            cursor: pointer;
            color: #0a0a0a;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.1em;
            transition: background 0.2s;
        }

        .search-row button:hover {
            background: #f0d060;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            color: var(--muted);
            font-size: 0.75rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            animation: fadeUp 0.8s 0.15s ease both;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="logo">What do you want to feel?</span></div>
        <p class="tagline">Describe how you want to feel watching a movie</p>
    </div>

    <div class="search-container">
        <div class="search-block">
            <span class="search-label">Describe the feelings</span>
            <form th:action="@{/recommend}" method="post">
                <div class="search-row">
                    <textarea id="feeling" name="text" placeholder="es. Epic space battles..."
                        rows="5" required></textarea>
                    <button type="submit">Go</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
